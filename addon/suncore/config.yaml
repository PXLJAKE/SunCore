# Home Assistant app configuration (stable channel).
# Keys verified against the Supervisor schema, see docs/research/ha-apps.md.
name: SunCore
version: "0.1.0" # x-release-please-version
slug: suncore
description: Energy management – forecasts, planner and real-time surplus control, explainable and safe by default.
url: https://github.com/pxljake/suncore
arch:
  - aarch64
  - amd64
image: ghcr.io/pxljake/suncore
init: false
startup: application
boot: auto
stage: experimental
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power-variant
panel_title: SunCore
panel_admin: true
homeassistant_api: true
hassio_api: true
hassio_role: default
services:
  - mqtt:want
watchdog: http://[HOST]:[PORT:8099]/health
backup: hot
backup_exclude:
  - timeseries.db
  - timeseries.db-wal
  - timeseries.db-shm
map:
  - type: homeassistant_config
    read_only: true
options:
  log_level: info
  controller_interval_s: 5
schema:
  log_level: list(debug|info|warning|error)
  controller_interval_s: int(2,60)
