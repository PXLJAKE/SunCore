name: SunCore
version: 0.2.0
slug: suncore
description: >-
  Energy management – forecasts, planner and real-time surplus control,
  explainable and safe by default.
url: https://github.com/pxljake/suncore
arch:
  - aarch64
  - amd64
image: ghcr.io/pxljake/suncore
init: false
stage: experimental
ingress: true
panel_icon: mdi:solar-power-variant
panel_title: SunCore
homeassistant_api: true
services:
  - mqtt:want
backup_exclude:
  - timeseries.db
  - timeseries.db-wal
  - timeseries.db-shm
map:
  - type: homeassistant_config
    read_only: true
options:
  log_level: info
  demo_mode: false
  controller_interval_s: 5
schema:
  log_level: list(debug|info|warning|error)
  demo_mode: bool
  controller_interval_s: int(2,60)
