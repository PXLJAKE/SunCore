# Home Assistant app configuration (stable channel).
# Keys verified against the Supervisor schema (docs/research/ha-apps.md).
# Defaults are omitted on purpose: the app linter rejects redundant defaults and
# the obsolete `watchdog` key (health is a Docker HEALTHCHECK in the Dockerfile).
name: SunCore
version: "0.2.0" # x-release-please-version
slug: suncore
description: Energy management – forecasts, planner and real-time surplus control, explainable and safe by default.
url: https://github.com/pxljake/suncore
arch:
  - aarch64
  - amd64
image: ghcr.io/pxljake/suncore
init: false
# ingress_port (8099) and panel_admin (true, panel is admin-only) are Supervisor
# defaults: omitted on purpose, the app linter rejects redundant defaults.
# Verified in supervisor/apps/validate.py on 2026-10-12 (docs/research/ha-apps.md).
ingress: true
panel_icon: mdi:solar-power-variant
panel_title: SunCore
homeassistant_api: true
# hassio_api (Supervisor REST) stays off: the MQTT broker lookup
# (GET /services/mqtt) is reachable without it, because the Supervisor lets apps call
# /services* regardless (supervisor/api/middleware/security.py, verified 2026-11-24;
# docs/research/ha-apps.md). The `services` role below is what grants the lookup.
services:
  - mqtt:want
backup_exclude:
  - timeseries.db
  - timeseries.db-wal
  - timeseries.db-shm
  - timeseries.db.corrupt*
map:
  - type: homeassistant_config
    read_only: true
options:
  log_level: info
  demo_mode: false
  controller_interval_s: 5
schema:
  log_level: list(debug|info|warning|error)
  demo_mode: bool
  controller_interval_s: int(2,60)
