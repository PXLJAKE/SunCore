# Home Assistant app configuration (beta channel).
# Same image as the stable app, built from main as pre-releases (ADR-0009).
name: SunCore (beta)
version: "0.3.0-beta.71"
slug: suncore_beta
description: Beta channel of SunCore – energy management with forecasts, planner and real-time surplus control.
url: https://github.com/pxljake/suncore
arch:
  - aarch64
  - amd64
image: ghcr.io/pxljake/suncore-beta
init: false
stage: experimental
# ingress_port (8099) and panel_admin (true, panel is admin-only) are Supervisor
# defaults: omitted on purpose, the app linter rejects redundant defaults.
# Verified in supervisor/apps/validate.py on 2026-10-12 (docs/research/ha-apps.md).
ingress: true
panel_icon: mdi:solar-power-variant
panel_title: SunCore β
homeassistant_api: true
# hassio_api (Supervisor REST) is not used yet; MQTT credentials via the
# services API will need it again (Phase 6). Least privilege until then.
services:
  - mqtt:want
backup_exclude:
  - timeseries.db
  - timeseries.db-wal
  - timeseries.db-shm
map:
  - type: homeassistant_config
    read_only: true
options:
  log_level: info
  demo_mode: false
  controller_interval_s: 5
schema:
  log_level: list(debug|info|warning|error)
  demo_mode: bool
  controller_interval_s: int(2,60)
