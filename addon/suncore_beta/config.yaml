# Home Assistant app configuration (beta channel).
# Same image as the stable app, built from main as pre-releases (ADR-0009).
name: SunCore (beta)
version: "0.3.0-beta.99"
slug: suncore_beta
description: Beta channel of SunCore – energy management with forecasts, planner and real-time surplus control.
url: https://github.com/pxljake/suncore
arch:
  - aarch64
  - amd64
image: ghcr.io/pxljake/suncore-beta
init: false
stage: experimental
# ingress_port (8099) and panel_admin (true, panel is admin-only) are Supervisor
# defaults: omitted on purpose, the app linter rejects redundant defaults.
# Verified in supervisor/apps/validate.py on 2026-10-12 (docs/research/ha-apps.md).
ingress: true
panel_icon: mdi:solar-power-variant
panel_title: SunCore β
homeassistant_api: true
# hassio_api (Supervisor REST) stays off: the MQTT broker lookup
# (GET /services/mqtt) is reachable without it, because the Supervisor lets apps call
# /services* regardless (supervisor/api/middleware/security.py, verified 2026-11-24;
# docs/research/ha-apps.md). The `services` role below is what grants the lookup.
services:
  - mqtt:want
backup_exclude:
  - timeseries.db
  - timeseries.db-wal
  - timeseries.db-shm
  - timeseries.db.corrupt*
# No `map`: SunCore reads nothing from the Home Assistant configuration folder (it talks to
# Core over the WebSocket API). The read-only `homeassistant_config` map of the scaffold was
# removed in the 1.0 security review (SEC-07, docs/security/review-1.0.md): it exposed
# secrets.yaml and .storage/ to the container.
options:
  log_level: info
  demo_mode: false
  controller_interval_s: 5
schema:
  log_level: list(debug|info|warning|error)
  demo_mode: bool
  controller_interval_s: int(2,60)
