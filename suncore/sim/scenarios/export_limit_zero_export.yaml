# SPDX-License-Identifier: Apache-2.0
name: export_limit_zero_export
description: A clear summer midday with zero export. The surplus goes to the pool pump first, the battery charges at its own maximum, and only then does SunCore limit the inverter's export limit number to 0 W (generic adapter, verified). The inverter keeps its own 13.5 kW limit throughout. A short cloud flicker at noon must not make the limit oscillate.
start: "2026-06-21T11:00:00+02:00"
duration_s: 10800
step_s: 10
house:
  seed: 5
  pv: {kwp: 8.0}
  load: {noise_fraction: 0.05}
  battery: {capacity_wh: 10000, max_charge_w: 2000, max_discharge_w: 3000, initial_soc_pct: 80}
  export_limiter:
    adapter: generic_number
    capability: export_limit
    hardware_export_limit_w: 13500
    initial_export_limit_w: 13500
outdoor: {mean_c: 26.0, amplitude_c: 6.0}
devices:
  - id: pool
    template: generic.switch
    physics: {kind: switch, nominal_w: 750, power_sensor: true}
    control:
      priority: 10
      min_run_s: 300
      min_pause_s: 300
      max_switches_per_hour: 4
      power_model: {kind: measured, power_role: power, nominal_w: 750}
clouds:
  - {at_s: 0, factor: 1.0}
  - {at_s: 3600, factor: 0.3}
  - {at_s: 3620, factor: 0.95}
  - {at_s: 3650, factor: 0.3}
  - {at_s: 3670, factor: 0.95}
  - {at_s: 3700, factor: 0.3}
  - {at_s: 3730, factor: 0.95}
  - {at_s: 3760, factor: 0.3}
  - {at_s: 3780, factor: 1.0}
grid:
  export_limit_w: 13500
  zero_export: true
inverter:
  mode: automatic
  verified: true
