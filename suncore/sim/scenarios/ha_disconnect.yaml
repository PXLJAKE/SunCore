# SPDX-License-Identifier: Apache-2.0
name: ha_disconnect
description: The Home Assistant connection drops for ten minutes while a pool pump and an air conditioner are under control. Nothing can be written during the outage; on reconnect SunCore releases both to the state they had at takeover and only then takes over again.
start: "2026-07-15T09:00:00+02:00"
duration_s: 18000
step_s: 5
house:
  seed: 51
  pv: {kwp: 8.0}
  load: {noise_fraction: 0.03}
  battery: {capacity_wh: 0}
outdoor: {mean_c: 28.0, amplitude_c: 5.0}
faults:
  - {kind: disconnect, from_s: 10800, to_s: 11400}
devices:
  - id: pool
    template: generic.switch
    physics: {kind: switch, nominal_w: 750, power_sensor: true}
    control:
      priority: 10
      min_run_s: 300
      min_pause_s: 300
      power_model: {kind: measured, power_role: power, nominal_w: 750}
  - id: ac
    template: lg.thinq_climate
    physics:
      kind: climate
      initial_mode: cool
      initial_setpoint_c: 24
      initial_temp_c: 24.5
      default_on_mode: cool
      nominal_w: 900
      ua_w_per_k: 250
      internal_gain_w: 400
      power_sensor: true
      power_poll_s: 10
    control:
      priority: 20
      comfort: {min_c: 21, max_c: 27}
      power_model: {kind: measured, power_role: power, nominal_w: 900}
