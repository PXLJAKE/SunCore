# SPDX-License-Identifier: Apache-2.0
name: ev_pv_only_flicker
description: >-
  PR 6-I. A car charges from PV surplus only (mode pv, the default) on a sunny summer day with
  two cloud-flicker episodes (10-40 s segments). The current follows the surplus in 1 A steps
  above the 6 A minimum, pauses when the surplus is gone and never imports for the car; the
  pause switch toggles within the switch limit.
start: "2026-07-15T11:00:00+02:00"
duration_s: 10800
step_s: 5
house:
  seed: 21
  pv: {kwp: 12.0}
  load: {noise_fraction: 0.05}
  battery: {capacity_wh: 0}
outdoor: {mean_c: 25.0, amplitude_c: 5.0}
devices:
  - id: wallbox
    template: generic.wallbox
    physics:
      kind: wallbox
      current_max: 16
      initial_current_a: 16
      initial_enabled: false
      initial_soc_pct: 30
      capacity_wh: 60000
    control:
      power_model: {kind: measured, power_role: charger_power, nominal_w: 11040}
      ev: {capacity_wh: 60000, vehicle_soc_role: vehicle_soc, connected_role: connected}
      behaviour_confirmed: true
    ev_mode: pv
clouds:
  - {at_s: 0, factor: 1.0}
  - {at_s: 1800, factor: 0.25}
  - {at_s: 1830, factor: 0.9}
