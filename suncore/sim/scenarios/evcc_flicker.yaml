# SPDX-License-Identifier: Apache-2.0
name: evcc_flicker
description: >-
  PR 6-J re-review R1. evcc charges by its own plan (`always_charge`) and the room left under
  the import limit hovers around evcc's 6 A minimum while clouds and house load flicker. The
  import cut must not flap between `off` and `smart`: off only after 60 s over the limit, back
  on only after 300 s and with 1 A of margin, and every off <-> on counts as a switch.
start: "2026-05-10T12:00:00+02:00"
duration_s: 3600
step_s: 5
house:
  seed: 43
  pv: {kwp: 2.0}
  load: {noise_fraction: 0.3}
  battery: {capacity_wh: 0}
outdoor: {mean_c: 12.0, amplitude_c: 4.0}
control:
  import_limit_w: 3300
  site_battery: false
