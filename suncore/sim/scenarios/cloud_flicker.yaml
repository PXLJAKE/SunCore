# SPDX-License-Identifier: Apache-2.0
name: cloud_flicker
description: Sunny summer morning with three cloud-flicker episodes (10-40 s sun/cloud segments); a pool pump and an air conditioner follow the surplus. Proves bounded switching.
start: "2026-07-15T10:00:00+02:00"
duration_s: 14400
step_s: 5
house:
  seed: 11
  pv: {kwp: 8.0}
  load: {noise_fraction: 0.05}
  battery: {capacity_wh: 0}
outdoor: {mean_c: 27.0, amplitude_c: 5.0}
devices:
  - id: pool
    template: generic.switch
    physics: {kind: switch, nominal_w: 750, power_sensor: true}
    control:
      priority: 10
      min_run_s: 300
      min_pause_s: 300
      max_switches_per_hour: 4
      power_model: {kind: measured, power_role: power, nominal_w: 750}
  - id: ac
    template: lg.thinq_climate
    physics:
      kind: climate
      initial_mode: cool
      initial_setpoint_c: 24
      initial_temp_c: 24.5
      default_on_mode: cool
      nominal_w: 900
      ua_w_per_k: 250
      internal_gain_w: 400
      power_sensor: true
      power_poll_s: 10
    control:
      priority: 20
      comfort: {min_c: 21, max_c: 27}
      power_model: {kind: measured, power_role: power, nominal_w: 900}
clouds:
  - {at_s: 0, factor: 1.0}
