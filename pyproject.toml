[project]
name = "suncore"
version = "0.1.0"
description = "Energy management for Home Assistant: forecasts, planner and real-time surplus control in one app."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "Jake Frietsch" }]
keywords = ["home-assistant", "energy-management", "photovoltaics", "battery", "ems"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Home Automation",
]
# Runtime dependencies grow with the phases (ADR-0001). Phase 0 ships an
# empty skeleton on purpose.
dependencies = [
  "aiohttp>=3.14.5",
  "aiosqlite>=0.22.1",
  "fastapi>=0.143.0",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.15.0",
  "pyyaml>=6.0.3",
  "structlog>=26.1.0",
  "uvicorn>=0.54.0",
  "websockets>=17.2",
]

[project.urls]
Homepage = "https://github.com/pxljake/suncore"
Documentation = "https://pxljake.github.io/SunCore"
Changelog = "https://github.com/pxljake/suncore/blob/main/CHANGELOG.md"
Issues = "https://github.com/pxljake/suncore/issues"

[project.scripts]
suncore = "suncore.__main__:main"

[dependency-groups]
dev = [
  "ruff>=0.14",
  "mypy>=1.19",
  "pytest>=8.4",
  "pytest-cov>=7",
  "hypothesis>=6.140",
  "types-pyyaml",
  "pytest-asyncio>=1.4.0",
  "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["suncore"]

[tool.hatch.build.targets.sdist]
include = ["suncore", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T10", "ISC", "ICN",
  "PIE", "PT", "Q", "RET", "SIM", "TID", "ARG", "PTH", "PL", "RUF", "ASYNC",
]
ignore = ["PLR2004", "PLR0913", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
packages = ["suncore"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_any_generics = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

# BRIEF §7: strict for the control-critical packages.
[[tool.mypy.overrides]]
module = ["suncore.core.*", "suncore.planner.*", "suncore.controller.*", "suncore.safety.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
  "slow: long-running tests, skipped by the pre-commit hook",
  "simulator: scenario tests against the virtual house",
]
xfail_strict = true

[tool.coverage.run]
source = ["suncore"]
branch = true

[tool.coverage.report]
# BRIEF §7 asks for >= 80 % on core/planner/controller/safety; enforced by
# a separate `coverage report --fail-under=80` in scripts/check.sh and CI.
show_missing = true
skip_covered = true

[tool.ruff.lint.isort]
known-first-party = ["suncore"]
