name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --all-groups --frozen
      - name: Lint
        run: |
          uv run ruff check . --output-format=github
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest -q --cov --cov-report=xml --cov-report=term-missing
      - name: OpenAPI schema up to date
        run: uv run python scripts/export_openapi.py --check
      - name: Template schemas up to date
        run: uv run python scripts/gen_schemas.py --check
      - name: Compatibility list up to date
        run: uv run python scripts/gen_compat.py --check
      - name: Templates valid
        run: uv run python scripts/validate_templates.py --check
      - name: Coverage gate (core, safety, planner, controller >= 80 %)
        run: uv run coverage report --include="suncore/core/*,suncore/safety/*,suncore/planner/*,suncore/controller/*" --fail-under=80
      - name: Upload coverage
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  lockfile:
    name: Lockfile up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv lock --check

  frontend:
    name: Frontend
    # Pinned: Playwright 1.56.1 cannot install Chromium on the ubuntu-latest image
    # (ubuntu 26.04, "Playwright does not support chromium on ubuntu26.04-x64").
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
          enable-cache: true
          python-version: "3.13"
      - name: Install backend (demo mode for E2E)
        run: uv sync --all-groups --frozen
      - name: Message keys present in the catalogues
        run: uv run python scripts/check_reasons.py
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: API types up to date
        working-directory: frontend
        run: npm run gen:api:check
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Format check
        working-directory: frontend
        run: npm run format:check
      - name: Type check (svelte-check)
        working-directory: frontend
        run: npm run check
      - name: Unit tests
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Bundle size budget (< 250 kB gzip)
        working-directory: frontend
        run: npm run size
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: E2E (demo backend)
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14
