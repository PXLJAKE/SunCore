name: Docs lint

on:
  push:
    branches: [main]
    paths: ["**/*.md", ".markdownlint-cli2.jsonc", ".github/workflows/docs-lint.yml"]
  pull_request:
    paths: ["**/*.md", ".markdownlint-cli2.jsonc", ".github/workflows/docs-lint.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: DavidAnson/markdownlint-cli2-action@992badcdf24e3b8eb7e87ff9287fe931bcb00c6e # v20.0.0
        with:
          globs: "**/*.md"

  links:
    name: Internal links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --include-fragments --no-progress --exclude-path docs/research/vendor "**/*.md"
          fail: true

  mermaid:
    name: Mermaid diagrams render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Render every diagram in docs/architecture.md
        run: |
          # Ubuntu 24.04 runners restrict unprivileged user namespaces; headless Chromium needs --no-sandbox.
          echo '{"args": ["--no-sandbox", "--disable-gpu"]}' > /tmp/puppeteer.json
          npx -y @mermaid-js/mermaid-cli@11 -p /tmp/puppeteer.json -i docs/architecture.md -o /tmp/architecture.md
          test -s /tmp/architecture-1.svg
