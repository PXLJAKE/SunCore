name: App lint

on:
  push:
    branches: [main]
    paths: ["addon/**", "repository.yaml", ".github/workflows/app-lint.yml"]
  pull_request:
    paths: ["addon/**", "repository.yaml", ".github/workflows/app-lint.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [suncore, suncore_beta]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Home Assistant app linter
        uses: frenck/action-app-linter@d51677290aef26cdfc835271dd3c7343ce502809 # v2.21.2
        with:
          path: ./addon/${{ matrix.app }}
