name: App lint

on:
  push:
    branches: [main]
    paths: ["addon/**", "repository.yaml", ".github/workflows/app-lint.yml"]
  pull_request:
    paths: ["addon/**", "repository.yaml", ".github/workflows/app-lint.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [suncore, suncore_beta]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Home Assistant app linter
        uses: frenck/action-app-linter@v2
        with:
          path: ./addon/${{ matrix.app }}
