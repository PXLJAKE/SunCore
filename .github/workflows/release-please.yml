# Opens and maintains the release PR from Conventional Commits (ADR-0009).
# Uses RELEASE_PLEASE_TOKEN (fine-grained PAT, contents + pull-requests
# write) when present so that the release triggers build.yml; falls back to
# GITHUB_TOKEN, in which case the build must be started with
# workflow_dispatch after a release.
name: Release please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
