# Builds the app image with the official Home Assistant builder actions
# (docs/research/ha-apps.md, ADR-0009).
#
# - pull_request: amd64 only, no push, smoke test of the loaded image.
# - push to main: both architectures, pushed as the beta image under a derived
#   version `<next>-beta.<n>` (scripts/beta_version.py, ADR-0009 addendum), then
#   the pushed per-arch image is pulled and smoke-tested (aarch64 memory, risk R4).
#   After the manifest is published the `bump-beta` job commits that version to
#   addon/suncore_beta/config.yaml on main, so Home Assistant offers the update.
# - release published: both architectures, pushed as the stable image, smoke test.
# The smoke test (scripts/smoke_image.sh) starts the image in demo mode, waits
# for /health, fails above 300 MiB after 60 s idle and checks the clean SIGTERM exit.
name: Build app image

on:
  pull_request:
    paths:
      - "addon/**"
      - "suncore/**"
      - "frontend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - "scripts/smoke_image.sh"
      - ".github/workflows/build.yml"
  push:
    branches: [main]
    paths:
      - "addon/**"
      # The bot's own version bump must not rebuild (loop guard, see bump-beta).
      - "!addon/suncore_beta/config.yaml"
      - "scripts/beta_version.py"
      - "suncore/**"
      - "frontend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".dockerignore"
      - "scripts/smoke_image.sh"
      - ".github/workflows/build.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Pushes to main (and releases) are serialised so beta versions are published
# and committed in order; a superseded pending run is dropped, the newest wins.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILDER_VERSION: "2026.09.0"

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.meta.outputs.version }}
      app_version: ${{ steps.meta.outputs.app_version }}
      image_name: ${{ steps.meta.outputs.image_name }}
      registry_prefix: ${{ steps.meta.outputs.registry_prefix }}
      architectures: ${{ steps.meta.outputs.architectures }}
      publish: ${{ steps.meta.outputs.publish }}
      app: ${{ steps.meta.outputs.app }}
      beta_version: ${{ steps.meta.outputs.beta_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select channel
        id: channel
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "app=suncore" >> "$GITHUB_OUTPUT"
          else
            echo "app=suncore_beta" >> "$GITHUB_OUTPUT"
          fi
      - name: Read app config
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: ./addon/${{ steps.channel.outputs.app }}
      - name: Derive metadata
        id: meta
        env:
          IMAGE: ${{ steps.info.outputs.image }}
          VERSION: ${{ steps.info.outputs.version }}
          ARCHS: ${{ steps.info.outputs.architectures }}
          APP: ${{ steps.channel.outputs.app }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # helpers/info emits YAML-quoted strings; strip the quotes.
          IMAGE="${IMAGE%\"}"; IMAGE="${IMAGE#\"}"
          VERSION="${VERSION%\"}"; VERSION="${VERSION#\"}"
          echo "image_name=${IMAGE##*/}" >> "$GITHUB_OUTPUT"
          echo "registry_prefix=${IMAGE%/*}" >> "$GITHUB_OUTPUT"
          echo "app=${APP}" >> "$GITHUB_OUTPUT"
          # The Supervisor pulls <image>:<config.yaml version>, so that tag must exist.
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "release" ]; then
            # Fails the run early if either config.yaml version is malformed.
            BETA_VERSION="$(python3 scripts/beta_version.py compute --run-number "${RUN_NUMBER}")"
            echo "beta_version=${BETA_VERSION}" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'architectures=["amd64"]' >> "$GITHUB_OUTPUT"
            echo "version=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "release" ]; then
            echo "architectures=${ARCHS}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # The Supervisor pulls <image>:<config.yaml version>; bump-beta commits
            # this very version once the manifest exists.
            echo "architectures=${ARCHS}" >> "$GITHUB_OUTPUT"
            echo "version=${BETA_VERSION}" >> "$GITHUB_OUTPUT"
            echo "app_version=${BETA_VERSION}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # workflow_dispatch: build and smoke-test, never publish.
            echo "architectures=${ARCHS}" >> "$GITHUB_OUTPUT"
            echo "version=${BETA_VERSION}-dispatch.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.meta.outputs.architectures }}
          image-name: ${{ steps.meta.outputs.image_name }}
          registry-prefix: ${{ steps.meta.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.app_version }}
            latest
          version: ${{ needs.prepare.outputs.version }}
          context: .
          file: addon/${{ needs.prepare.outputs.app }}/Dockerfile
          push: ${{ needs.prepare.outputs.publish }}
          load: ${{ needs.prepare.outputs.publish == 'false' }}
          cosign: ${{ needs.prepare.outputs.publish }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          labels: |
            io.hass.type=app
            io.hass.name=SunCore
            io.hass.url=https://github.com/pxljake/suncore
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Pull pushed image for the smoke test
        if: needs.prepare.outputs.publish == 'true'
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE_REF: ${{ matrix.image }}:${{ needs.prepare.outputs.version }}
        run: |
          echo "${REGISTRY_PASSWORD}" | docker login ghcr.io -u "${REGISTRY_USER}" --password-stdin
          docker pull "${IMAGE_REF}"
      - name: Smoke test
        env:
          IMAGE_REF: ${{ matrix.image }}:${{ needs.prepare.outputs.version }}
        run: ./scripts/smoke_image.sh "${IMAGE_REF}"

  manifest:
    name: Publish multi-arch manifest
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.app_version }}
            latest
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  bump-beta:
    name: Commit beta version to main
    needs: [prepare, build, manifest]
    if: github.event_name == 'push' && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BETA_VERSION: ${{ needs.prepare.outputs.beta_version }}
    steps:
      # Only after the image and manifest exist: HA must never be offered a
      # version whose tag cannot be pulled.
      - uses: actions/checkout@v7
        with:
          ref: main
          # RELEASE_PLEASE_TOKEN (PAT) may bypass branch protection; GITHUB_TOKEN
          # pushes never retrigger workflows. Loop guards: the paths filter above,
          # `[skip ci]` in the message.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit the version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            status=0
            python3 scripts/beta_version.py write "${BETA_VERSION}" || status=$?
            if [ "${status}" = "3" ]; then
              echo "::notice::main already has a newer beta version, nothing to commit"
              exit 0
            elif [ "${status}" != "0" ]; then
              exit "${status}"
            fi
            if git diff --quiet -- addon/suncore_beta/config.yaml; then
              echo "::notice::config.yaml already at ${BETA_VERSION}"
              exit 0
            fi
            git commit -m "chore(beta): bump app version to ${BETA_VERSION} [skip ci]" \
              -- addon/suncore_beta/config.yaml
            if git push origin HEAD:main; then
              exit 0
            fi
            git reset --hard origin/main
          done
          echo "::error::could not push the beta version bump (branch protection? see ADR-0009 addendum)"
          exit 1
