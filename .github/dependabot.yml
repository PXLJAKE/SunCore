version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /addon/suncore
      - /addon/suncore_beta
    schedule:
      interval: weekly
  # Security review 1.0 (SEC-09): the SPA's npm lockfile was not watched. Runtime and
  # development dependencies in separate groups, so a test tool bump cannot hide a runtime one.
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-runtime:
        dependency-type: production
      npm-dev:
        dependency-type: development
