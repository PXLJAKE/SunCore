name: Bug report
description: Something does not work as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Please attach the anonymised diagnostics export from the SunCore panel (Diagnostics → Export). It contains no secrets.
  - type: input
    id: version
    attributes:
      label: SunCore version
      placeholder: "0.3.1 (stable) / 0.4.0-beta.2"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options: [Home Assistant OS app, Standalone container]
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual behaviour, with times so the decision log can be matched.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics export / logs
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: A device was switched or a set-point written in a way that violated a configured limit (please describe above – this is handled with priority).
