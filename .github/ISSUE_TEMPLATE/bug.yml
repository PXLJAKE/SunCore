name: Bug report
description: Something does not work as documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please attach the diagnostics export: Settings → Advanced → Diagnostics → Download
        (the API route is `GET /api/v1/diagnostics`). Secrets are masked and entity ids, device
        and area names are pseudonymised. If your version has no Diagnostics panel yet, attach
        the app log (Log tab) instead and describe your setup in words. Never paste tokens or
        passwords.
  - type: input
    id: version
    attributes:
      label: SunCore version
      placeholder: "0.3.1 (stable) / 0.4.0-beta.2"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options: [Home Assistant OS app, Standalone container]
    validations:
      required: true
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Expected vs actual behaviour, with times so the decision log can be matched.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics export / logs
      description: Drag the downloaded JSON file here, or paste the relevant log lines.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: A device was switched or a set-point written in a way that violated a configured limit (please describe above – this is handled with priority).
