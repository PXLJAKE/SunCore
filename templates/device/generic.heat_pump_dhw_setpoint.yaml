# yaml-language-server: $schema=../schema/device.schema.json
# A heat pump's hot-water set-point, exposed as a Home Assistant `water_heater` entity (vendor
# integrations of heat pumps and hot-water heat pumps commonly do). SunCore lifts the target
# temperature above the user's own set-point while there is surplus - never below it, never
# above `comfort.max_c` nor the entity's `max_temp` - and restores the user's set-point when it
# releases the device. The heat pump's own controller decides when its compressor runs.
# SunCore never writes while the entity is `off`.
id: generic.heat_pump_dhw_setpoint
kind: device
schema_version: 1
name: template.generic.heat_pump_dhw_setpoint.name
source:
  - title: "home-assistant/core water_heater/__init__.py + services.yaml (set_temperature, temperature/current_temperature/min_temp/max_temp; dev c433453)"
    url: "https://github.com/home-assistant/core/blob/c433453ac565f083a4515ec5edfbdbede48ebf24/homeassistant/components/water_heater/__init__.py"
    date: 2026-10-14
tested_with: []
capabilities: [temperature_setpoint, power_measured]
unverified:
  - "Maintainer has no heat pump - simulator only (water_heater.sim_heat_pump_dhw). Never run against hardware."
  - "Which vendor integrations expose the heat pump's hot-water set-point as a water_heater entity, and how fast they apply a new target, is not known to the author."
  - "Lift up to 5 K in 0.5 K steps and comfort band 45-55 C are design defaults; the entity's own min_temp/max_temp bound every write."
  - "min_run_s 1200 and min_pause_s 600 are conservative design defaults for a compressor."
device_kind: heat_pump
roles:
  water_heater:
    matcher:
      domain: water_heater
    description: template.generic.heat_pump_dhw_setpoint.role.water_heater
  power:
    required: false
    matcher:
      domain: sensor
      device_class: power
      units: [W, kW]
    description: template.generic.heat_pump_dhw_setpoint.role.power
defaults:
  power_model:
    kind: nominal
  control:
    kind: setpoint
    role: water_heater
    shift_max_c: 5
    step_c: 0.5
  settle_s: 60
  min_run_s: 1200
  min_pause_s: 600
  max_switches_per_hour: 3
  hysteresis_w: 200
  hysteresis_delay_s: 120
  comfort:
    min_c: 45
    max_c: 55
  thermal: {}
