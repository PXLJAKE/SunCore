# yaml-language-server: $schema=../schema/device.schema.json
# Any `switch` entity (smart plug, relay) with an optional power sensor of the same device.
id: generic.switch
kind: device
schema_version: 1
name: template.generic.switch.name
source:
  - title: "home-assistant/core switch/__init__.py (turn_on, turn_off services; branch dev, fetched 2026-10-13)"
    url: "https://github.com/home-assistant/core/blob/dev/homeassistant/components/switch/__init__.py"
    date: 2026-10-13
  - title: "developers.home-assistant docs/core/entity/switch.md (GitHub mirror)"
    url: "https://github.com/home-assistant/developers.home-assistant/blob/master/docs/core/entity/switch.md"
    date: 2026-10-13
  - title: "home-assistant/core sensor/const.py (SensorDeviceClass.POWER, unit sets)"
    url: "https://github.com/home-assistant/core/blob/dev/homeassistant/components/sensor/const.py"
    date: 2026-10-13
  - title: "home-assistant/core const.py (UnitOfPower: W, kW)"
    url: "https://github.com/home-assistant/core/blob/dev/homeassistant/const.py"
    date: 2026-10-13
tested_with: []
capabilities: [on_off, power_measured]
unverified:
  - "Generic template, exercised in the simulator only (switch.sim_pool_pump); not tested with a physical plug."
  - "min_run_s and min_pause_s are conservative design defaults for motor loads such as pumps."
device_kind: switch
roles:
  switch:
    matcher:
      domain: switch
    description: template.generic.switch.role.switch
  power:
    required: false
    same_device_as: switch
    matcher:
      domain: sensor
      device_class: power
      units: [W, kW]
    description: template.generic.switch.role.power
defaults:
  # The wizard offers `measured` when the optional power role is mapped and asks for the
  # nominal power (W) otherwise.
  power_model:
    kind: nominal
  control:
    kind: on_off
    role: switch
  settle_s: 3
  min_run_s: 300
  min_pause_s: 300
